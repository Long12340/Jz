<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Chúc Gửi Đến Bé Qi Long</title>
    <!-- Load Tailwind CSS for modern styling and responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font Quicksand for a soft, romantic look -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1b1a30 0%, #0d0c1d 100%);
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Starry background effect */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 6px white); }
        }

        /* Floating floating heart CSS */
        .floating-heart {
            position: absolute;
            bottom: -20px;
            color: rgba(244, 114, 182, 0.7);
            font-size: var(--size);
            animation: floatUp var(--speed) linear infinite;
            user-select: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Card glassmorphism style */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(236, 72, 153, 0.2);
        }

        /* Heartbeat animation */
        .heartbeat {
            animation: pulseBeat 1.4s infinite ease-in-out;
        }

        @keyframes pulseBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body class="relative w-full h-screen">

    <!-- Dynamic Stars Container -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- Dynamic Floating Hearts Container -->
    <div id="hearts-container" class="absolute inset-0 pointer-events-none z-10"></div>

    <!-- Main Content Container -->
    <main class="relative z-20 flex flex-col items-center justify-center p-6 w-full max-w-lg mx-auto text-center">
        
        <div class="glass-card rounded-3xl p-8 md:p-12 w-full transform transition-all duration-700 hover:scale-[1.02]">
            
            <!-- Glowing Heart Icon -->
            <div class="mb-6 flex justify-center">
                <div class="w-20 h-20 bg-pink-500/20 rounded-full flex items-center justify-center border border-pink-400/40 shadow-lg shadow-pink-500/30">
                    <span class="text-4xl heartbeat select-none">💖</span>
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300 mb-6 tracking-wide uppercase">
                Lời chúc gửi đến bé Qi Long
            </h1>

            <!-- Divider Line -->
            <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-pink-400 to-transparent mx-auto mb-6 opacity-60"></div>

            <!-- Message content -->
            <p class="text-pink-100 text-lg md:text-xl font-medium leading-relaxed tracking-wide drop-shadow">
                “Chúc bạn ngủ ngon, mơ xinh, và cảm ơn anh vì đã yêu em”
            </p>

            <!-- Small interactive reaction button -->
            <div class="mt-8">
                <button onclick="createBurst()" class="px-6 py-3 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-semibold rounded-full shadow-lg shadow-pink-500/30 transform active:scale-95 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-pink-400">
                    Gửi ngàn yêu thương ✨
                </button>
            </div>

        </div>

    </main>

    <script>
        // Generate starry night background
        function initStars() {
            const container = document.getElementById('stars-container');
            const starCount = 60;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                const duration = Math.random() * 3 + 2;
                const opacity = Math.random() * 0.7 + 0.3;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--opacity', opacity);
                
                container.appendChild(star);
            }
        }

        // Generate continuous floating hearts
        function initFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartSymbols = ['❤️', '💖', '✨', '💕', '💗', '⭐'];

            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                
                heart.style.left = `${Math.random() * 100}%`;
                
                const size = Math.random() * 1.5 + 0.8 + 'rem';
                heart.style.setProperty('--size', size);
                
                const speed = Math.random() * 6 + 6 + 's';
                heart.style.setProperty('--speed', speed);
                
                container.appendChild(heart);

                // Clean up DOM after animation completes
                setTimeout(() => {
                    heart.remove();
                }, 12000);
            }, 800);
        }

        // Interactive burst effect when clicking the button
        function createBurst() {
            const container = document.getElementById('hearts-container');
            const emojis = ['💖', '✨', '🌹', '💘', '⭐'];
            
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'absolute text-2xl pointer-events-none z-30 transition-all duration-1000 ease-out';
                particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Start from center of screen
                const startX = window.innerWidth / 2;
                const startY = window.innerHeight / 2;
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;
                
                container.appendChild(particle);
                
                // Random angle and distance
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50;
                const destX = startX + Math.cos(angle) * distance;
                const destY = startY + Math.sin(angle) * distance;
                
                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${destX - startX}px, ${destY - startY}px) scale(${Math.random() * 1.5 + 0.5})`;
                    particle.style.opacity = '0';
                });

                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        // Initialize animations on window load
        window.onload = function () {
            initStars();
            initFloatingHearts();
        };
    </script>
</body>
</html>
